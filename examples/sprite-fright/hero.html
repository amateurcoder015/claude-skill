<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Cinzel:wght@600&display=swap" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 70%, #0f2a1c 0%, __BG__ 65%); }
        .sf-glow { position: absolute; left: 50%; top: 58%; width: 120vmin; height: 60vmin; margin: -30vmin 0 0 -60vmin; border-radius: 50%; background: radial-gradient(ellipse, rgba(80, 255, 140, 0.35) 0%, transparent 70%); filter: blur(30px); }
        .sf-cap { position: absolute; left: 50%; bottom: -34vmin; width: 110vmin; height: 70vmin; margin-left: -55vmin; border-radius: 50% 50% 8% 8% / 100% 100% 10% 10%; background: radial-gradient(ellipse at 50% 30%, #e0453a 0%, #8f1f1a 70%); transform-origin: 50% 100%; box-shadow: 0 0 80px rgba(224, 69, 58, 0.35); }
        .sf-dot { position: absolute; border-radius: 50%; background: #f4ecd8; opacity: 0.92; }
        .sf-spore { position: absolute; width: 0.9vmin; height: 0.9vmin; border-radius: 50%; background: #9dffb9; box-shadow: 0 0 1.6vmin #5cff93; }
        .sf-title { position: absolute; left: 0; right: 0; top: 22%; margin: 0; padding: 0 6%; text-align: center; font-family: "Creepster", cursive; font-weight: 400; font-size: 18vmin; line-height: 0.95; letter-spacing: 0.08em; color: #f4ecd8; text-shadow: 0 0 2.4vmin rgba(92, 255, 147, 0.55), 0 0.8vmin 0 #1b0b08; }
        .sf-line { display: block; }
        .sf-word { display: inline-block; white-space: nowrap; }
        .sf-word + .sf-word { margin-left: 0.25em; }
        .sf-word:last-child .sf-ch { color: #ff6a58; text-shadow: 0 0.8vmin 0 #1b0b08, 0 0 1.4vmin rgba(0, 0, 0, 0.7); }
        .sf-ch { display: inline-block; transform-origin: 50% 100%; }
        .sf-sub { position: absolute; left: 0; right: 0; top: 62%; text-align: center; font-family: "Cinzel", serif; font-weight: 600; font-size: 3vmin; letter-spacing: 0.6em; color: __ACCENT__; }
        .sf-sub:empty { display: none; }
        .sf-flash { position: absolute; inset: 0; background: #7dffa6; mix-blend-mode: screen; opacity: 0; }
      </style>
      <div id="root" data-composition-id="__ID__" data-width="__W__" data-height="__H__">
        <div class="sf-glow"></div>
        <div class="sf-cap"></div>
        <div class="sf-spores"></div>
        <h1 class="sf-title"><span class="sf-line">__TEXT__</span></h1>
        <div class="sf-sub">__SUB__</div>
        <div class="sf-flash"></div>
      </div>
      <script>
        (() => {
          const q = (sel) => document.querySelectorAll('[data-composition-id="__ID__"] ' + sel);
          const D = __DUR__;
          const hash = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };

          // Mushroom-cap spots, placed deterministically.
          const cap = q(".sf-cap")[0];
          [[18, 28, 11], [42, 14, 9], [66, 26, 13], [30, 52, 8], [56, 48, 10], [80, 50, 7]].forEach(([x, y, s]) => {
            const dot = document.createElement("div");
            dot.className = "sf-dot";
            dot.style.left = x + "%";
            dot.style.top = y + "%";
            dot.style.width = s + "%";
            dot.style.height = s * 1.57 + "%";
            cap.appendChild(dot);
          });

          // Glowing spores.
          const spores = q(".sf-spores")[0];
          for (let i = 0; i < 46; i++) {
            const s = document.createElement("div");
            s.className = "sf-spore";
            s.style.left = (hash(i) * 100).toFixed(2) + "%";
            s.style.top = (55 + hash(i + 100) * 50).toFixed(2) + "%";
            const k = 0.5 + hash(i + 200) * 1.3;
            s.style.width = s.style.height = k.toFixed(2) + "vmin";
            spores.appendChild(s);
          }

          // Split the title into word spans of letter spans (contract rule 11).
          const line = q(".sf-line")[0];
          const words = line.textContent.trim().split(/\s+/);
          line.textContent = "";
          let count = 0;
          words.forEach((w, i) => {
            const word = document.createElement("span");
            word.className = "sf-word";
            [...w].forEach((c) => {
              const ch = document.createElement("span");
              ch.className = "sf-ch";
              ch.textContent = c;
              word.appendChild(ch);
              count += 1;
            });
            line.appendChild(word);
            if (i < words.length - 1) line.appendChild(document.createTextNode(" "));
          });

          const tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".sf-glow"), { opacity: 0.2, scale: 0.8 }, { opacity: 1, scale: 1.15, duration: D, ease: "sine.inOut" }, 0);
          tl.fromTo(q(".sf-cap"), { scaleY: 0, scaleX: 0.6 }, { scaleY: 1, scaleX: 1, duration: 1.1, ease: "back.out(1.6)" }, 0.1);
          tl.fromTo(q(".sf-cap"), { y: 0 }, { y: -12, duration: D - 1.2, ease: "sine.inOut", immediateRender: false }, 1.2);
          q(".sf-spore").forEach((s, i) => {
            const rise = 30 + hash(i + 300) * 50;
            const drift = (hash(i + 400) - 0.5) * 12;
            tl.fromTo(s, { opacity: 0, y: 0, x: 0 }, { opacity: 0.95, y: -rise + "vmin", x: drift + "vmin", duration: D, ease: "none" }, hash(i + 500) * 0.8);
          });
          const step = Math.min(0.07, (D * 0.35) / Math.max(count, 1));
          tl.fromTo(q(".sf-ch"), { yPercent: 120, scaleY: 0.2, opacity: 0, rotation: (i) => (i % 2 ? -10 : 10) }, { yPercent: 0, scaleY: 1, opacity: 1, rotation: 0, duration: 0.55, ease: "back.out(2.4)", stagger: step }, 0.45);
          tl.to(q(".sf-ch"), { yPercent: (i) => (i % 2 ? -4 : 4), duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor((D - 1.8) / 0.6)), stagger: 0.03, immediateRender: false }, 0.45 + step * count + 0.2);
          tl.fromTo(q(".sf-title"), { scale: 0.96 }, { scale: 1.04, duration: D, ease: "none" }, 0);
          tl.fromTo(q(".sf-sub"), { opacity: 0, scaleX: 1.25 }, { opacity: 1, scaleX: 1, duration: 1.0, ease: "power2.out" }, 1.0);
          tl.fromTo(q(".sf-flash"), { opacity: 0 }, { opacity: 0.85, duration: 0.12, ease: "power2.in" }, D - 0.3);
          tl.to(q(".sf-flash"), { opacity: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, D - 0.18);
          tl.to(q(".sf-title, .sf-sub, .sf-cap, .sf-spores"), { opacity: 0, duration: 0.2, immediateRender: false }, D - 0.2);
          window.__timelines["__ID__"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
